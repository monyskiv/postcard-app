server:
  port: 8080

spring:
  application:
    name: postcards
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postcards}
    username: ${DB_USER:postcards}
    password: ${DB_PASSWORD:postcards}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
